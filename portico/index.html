<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sutra — Talent Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
/* ── TOKENS ─────────────────────────────────────────── */
:root {
  --rausch: #FF5A5F;
  --rausch-50: #FFF0F0;
  --rausch-100: #FFDDDE;
  --babu: #00A699;
  --babu-50: #E5F7F6;
  --babu-100: #BDE9E7;
  --arches: #FC642D;
  --arches-50: #FFF3EE;
  --arches-100: #FFE2D1;
  --arches-200: #FFCBB3;
  --hof: #484848;
  --foggy: #767676;
  --text: #484848;
  --text-2: #767676;
  --text-3: #AAAAAA;
  --bg: #F7F7F7;
  --surface: #FFFFFF;
  --border: #EBEBEB;
  --border-strong: #D5D5D5;
  --nav-bg: #2C2C2C;
  --nav-text: #FFFFFF;
  --nav-text-2: #A8A8A8;
  --int-bg: #FFF8F0;
  --r: 8px;
  --r-sm: 4px;
  --r-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.07);
  --shadow: 0 2px 6px rgba(0,0,0,0.08);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.1);
  --font: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-serif: 'DM Serif Display', Georgia, serif;
}

/* ── RESET ───────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.5; -webkit-font-smoothing: antialiased; min-height: 100vh; }
button { font-family: var(--font); cursor: pointer; }

/* ── TOP NAV ─────────────────────────────────────────── */
.topnav {
  position: sticky; top: 0; z-index: 100;
  background: var(--nav-bg); height: 52px;
  display: flex; align-items: center; padding: 0 24px; gap: 12px;
}
.topnav-logo {
  font-size: 15px; font-weight: 700; color: var(--nav-text);
  letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px;
  flex-shrink: 0; cursor: pointer; text-decoration: none;
}
.logo-mark {
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; line-height: 1;
}
.nav-div { width: 1px; height: 20px; background: rgba(255,255,255,0.12); flex-shrink: 0; }
.breadcrumb {
  display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; overflow: hidden;
}
.bc-link {
  color: var(--nav-text-2); font-size: 13px; cursor: pointer;
  white-space: nowrap; transition: color 0.15s; text-decoration: underline;
  text-underline-offset: 2px; text-decoration-color: transparent; padding: 2px 0;
}
.bc-link:hover { color: var(--nav-text); text-decoration-color: rgba(255,255,255,0.3); }
.bc-sep { color: rgba(255,255,255,0.2); font-size: 12px; flex-shrink: 0; }
.bc-cur { color: var(--nav-text); font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.view-toggle {
  display: flex; align-items: center; background: rgba(255,255,255,0.08);
  border-radius: 8px; padding: 3px; gap: 2px; flex-shrink: 0;
}
.view-toggle button {
  padding: 5px 14px; border-radius: 6px; border: none;
  font-size: 12px; font-weight: 500; color: var(--nav-text-2); background: transparent; transition: all 0.15s;
}
.view-toggle button.active { background: white; color: var(--text); box-shadow: var(--shadow-sm); }
.mode-switcher {
  display: flex; align-items: center; gap: 2px;
  background: rgba(255,255,255,0.08); border-radius: 8px; padding: 3px;
  margin-right: 4px;
}
.mode-btn {
  display: flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: 6px; border: none;
  font-size: 11px; font-weight: 600; cursor: pointer;
  color: rgba(255,255,255,0.5); background: transparent;
  text-decoration: none; transition: all 0.15s; white-space: nowrap;
}
.mode-btn:hover { color: rgba(255,255,255,0.8); }
.mode-btn.active { background: white; color: var(--hof); }
.bell-btn {
  position: relative; width: 34px; height: 34px; border-radius: 8px;
  border: none; background: rgba(255,255,255,0.08); color: var(--nav-text-2);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; transition: background 0.15s; flex-shrink: 0;
}
.bell-btn:hover { background: rgba(255,255,255,0.14); }
.bell-badge {
  position: absolute; top: 3px; right: 3px; min-width: 16px; height: 16px;
  background: var(--rausch); border-radius: 50%; font-size: 9px; font-weight: 700;
  color: white; display: flex; align-items: center; justify-content: center;
  border: 2px solid var(--nav-bg);
}
.nav-avatar {
  width: 30px; height: 30px; border-radius: 50%; background: var(--arches);
  color: white; font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}

/* ── TAB BAR ─────────────────────────────────────────── */
.tabbar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 28px; display: flex; gap: 0; overflow-x: auto;
}
.tabbar::-webkit-scrollbar { display: none; }
.tab-btn {
  padding: 12px 18px 11px; border: none; background: transparent;
  font-size: 13px; font-weight: 500; color: var(--text-2);
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  display: flex; align-items: center; gap: 6px; transition: color 0.15s; white-space: nowrap;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--text); border-bottom-color: var(--rausch); }
.tab-pill {
  background: var(--rausch-100); color: var(--rausch);
  font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px;
}

/* ── CONTENT ─────────────────────────────────────────── */
.content { padding: 32px 36px; max-width: 1280px; margin: 0 auto; }

/* ── BACK LINK ───────────────────────────────────────── */
.back-link {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12px; font-weight: 600; color: var(--text-2);
  border: none; background: none; padding: 0; margin-bottom: 20px; transition: color 0.15s;
}
.back-link:hover { color: var(--text); }

/* ── STATS ROW ───────────────────────────────────────── */
.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 22px 24px; box-shadow: var(--shadow-sm); }
.stat-label { font-size: 11px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
.stat-val { font-size: 30px; font-weight: 700; color: var(--text); line-height: 1; }
.stat-val.rausch { color: var(--rausch); }
.stat-val.arches { color: var(--arches); }

/* ── TABLE WRAPPER (enables horizontal scroll) ───────── */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); overflow: hidden; }
table { width: 100%; border-collapse: collapse; min-width: 700px; }
thead th {
  padding: 10px 20px; font-size: 10px; font-weight: 700; color: var(--text-3);
  text-transform: uppercase; letter-spacing: 0.06em; text-align: left;
  background: #FAFAFA; border-bottom: 1px solid var(--border); white-space: nowrap;
}
tbody tr { border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.1s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: #FAFAFA; }
tbody td { padding: 16px 20px; font-size: 13px; color: var(--text); vertical-align: middle; }

/* ── CHIPS & BADGES ──────────────────────────────────── */
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; white-space: nowrap;
}
.chip-babu { background: var(--babu-50); color: var(--babu); }
.chip-arches { background: var(--arches-100); color: var(--arches); }
.chip-rausch { background: var(--rausch-100); color: var(--rausch); }
.chip-gray { background: #F0F0F0; color: var(--text-2); }
.chip-purple { background: #EDE9FE; color: #7C3AED; }
.badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
.badge-internal { background: var(--arches-100); border: 1px solid var(--arches-200); color: var(--arches); }
.badge-external { background: #EFF6FF; border: 1px solid #DBEAFE; color: #2563EB; }

/* Pipeline */
.pipeline-mini { display: flex; align-items: center; gap: 6px; }
.pipeline-stage { display: flex; flex-direction: column; align-items: center; gap: 1px; }
.pipeline-num { font-size: 13px; font-weight: 600; color: var(--text); }
.pipeline-label { font-size: 9px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.04em; }
.pipeline-arrow { color: var(--border-strong); font-size: 10px; margin-bottom: 10px; }

/* Days open */
.days-ok { font-size: 13px; font-weight: 500; }
.days-warn { font-size: 13px; font-weight: 600; color: var(--arches); }
.days-danger { font-size: 13px; font-weight: 700; color: var(--rausch); }

/* Integration dot */
.int-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.int-synced { background: var(--babu); }
.int-stale { background: var(--arches); }
.int-disconnected { background: var(--rausch); }
.int-label { font-size: 11px; color: var(--text-3); }

/* Internal match cell */
.internal-match-cell {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px; background: var(--arches-50);
  border: 1px solid var(--arches-200); border-radius: 20px;
  font-size: 12px; font-weight: 600; color: var(--arches);
}

/* Stage chips */
.stage { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.stage-applied { background: #F0F0F0; color: var(--text-2); }
.stage-screen { background: var(--babu-50); color: var(--babu); }
.stage-loop { background: var(--arches-100); color: var(--arches); }
.stage-offer { background: var(--babu-100); color: #007A72; }
.stage-rejected { background: #FEE2E2; color: #B91C1C; }
.stage-withdrawn { background: #F3F4F6; color: #6B7280; }
.stage-exit-trace { font-size: 10px; color: var(--text-3); margin-top: 2px; }

/* ── EDITORIAL / SERIF MOMENTS ───────────────────────── */
.editorial {
  font-family: var(--font-serif); font-style: italic;
  font-size: 18px; color: var(--text); line-height: 1.4;
  margin-bottom: 28px;
}
.editorial span { color: var(--rausch); font-style: normal; }

/* ── ROLE BREAKOUT ───────────────────────────────────── */
.page-title { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
.page-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 24px; }
.page-meta-item { font-size: 12px; color: var(--text-2); display: flex; align-items: center; gap: 5px; }
.page-meta-sep { color: var(--border-strong); }
.role-meta-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 28px; box-shadow: var(--shadow-sm);
}
.role-meta-left { display: flex; align-items: center; flex: 1; gap: 0; }
.rmi { display: flex; flex-direction: column; gap: 0; flex: 1; padding: 0 16px; align-items: center; text-align: center; }
.rmi:first-child { padding-left: 0; }
.rmi-chevron { font-size: 20px; color: var(--border-strong); flex-shrink: 0; line-height: 1; margin-top: -6px; }
.rmi-label { font-size: 10px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 1px; }
.rmi-sublabel { font-size: 10px; font-weight: 400; color: var(--text-3); text-transform: lowercase; letter-spacing: 0; margin-bottom: 5px; }
.rmi-active { font-size: 28px; font-weight: 700; color: var(--text); line-height: 1; margin-bottom: 4px; }
.rmi-dropout { font-size: 10px; color: var(--text-3); }
.rmi-offer-icon { font-size: 24px; line-height: 1; margin-bottom: 4px; }
.rmi-offer-label { font-size: 11px; font-weight: 600; }
.rmi-offer-label-accepted { color: #059669; }
.rmi-offer-label-pending { color: var(--babu); }
.rmi-offer-label-none { color: var(--text-3); }

/* Internal section */
.int-section {
  background: var(--int-bg); border: 1px solid var(--arches-200);
  border-radius: var(--r-lg); padding: 22px; margin-bottom: 28px;
}
.int-section-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.int-section-title { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--arches); }
.int-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.int-card {
  background: white; border: 1px solid var(--arches-200); border-left: 3px solid var(--arches);
  border-radius: var(--r); padding: 18px; cursor: pointer;
  transition: box-shadow 0.15s, transform 0.1s;
}
.int-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
.int-card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
.int-rank {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--arches-100); border: 1.5px solid var(--arches-200);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: var(--arches); flex-shrink: 0;
}
.int-name { font-size: 14px; font-weight: 700; color: var(--text); }
.int-role { font-size: 12px; color: var(--text-2); margin-top: 1px; }
.int-match { font-size: 26px; font-weight: 800; color: var(--rausch); line-height: 1; text-align: right; }
.int-match span { font-size: 11px; font-weight: 500; color: var(--text-2); }
.int-card-stats {
  display: flex; gap: 14px; margin-top: 12px;
  padding-top: 12px; border-top: 1px solid var(--arches-100); flex-wrap: wrap;
}
.int-stat { display: flex; flex-direction: column; gap: 1px; }
.int-stat-label { font-size: 9px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.05em; }
.int-stat-val { font-size: 12px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 4px; }

/* All candidates */
.section-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.section-title { font-size: 14px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; }
.section-count { background: #EFEFEF; color: var(--text-2); font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; }
.filter-tabs { display: flex; gap: 4px; }
.ftab {
  padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--surface); font-size: 12px; font-weight: 500;
  color: var(--text-2); transition: all 0.15s;
}
.ftab:hover { border-color: var(--border-strong); color: var(--text); }
.ftab.active { background: var(--text); border-color: var(--text); color: white; }

/* Candidate rows */
.cand-row {
  display: flex; align-items: center; padding: 14px 20px;
  border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.1s; gap: 14px;
  min-width: 700px;
}
.cand-row:last-child { border-bottom: none; }
.cand-row:hover { background: #FAFAFA; }
.cand-row-terminal { opacity: 0.65; }
.cand-row-terminal:hover { background: #FAFAFA; opacity: 0.8; }
.cand-rank { font-size: 12px; font-weight: 700; color: var(--text-3); width: 18px; text-align: center; flex-shrink: 0; }
.cand-id { flex: 1; min-width: 0; overflow: hidden; }
.cand-name { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cand-role { font-size: 12px; color: var(--text-2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cand-match { font-size: 14px; font-weight: 700; color: var(--rausch); width: 54px; flex-shrink: 0; }
.cand-churn { width: 92px; flex-shrink: 0; display: flex; justify-content: flex-start; }
.cand-champs { width: 50px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-2); }
.cand-stage { flex-shrink: 0; width: 110px; }
.sort-hd { cursor: pointer; user-select: none; display: flex; align-items: center; gap: 4px; }
.sort-hd:hover { color: var(--text) !important; }
.sort-arrow { font-size: 9px; opacity: 0.5; }
.sort-hd.active { color: var(--text) !important; }
.sort-hd.active .sort-arrow { opacity: 1; color: var(--rausch); }
.cand-hist { font-size: 11px; color: var(--text-3); width: 74px; text-align: center; flex-shrink: 0; }
.cand-arrow { color: var(--text-3); font-size: 13px; flex-shrink: 0; }

/* ── CANDIDATE PACKET ────────────────────────────────── */
.packet-layout { display: grid; grid-template-columns: 1fr 356px; gap: 20px; align-items: start; }
.packet-main { min-width: 0; }
.packet-side { position: sticky; top: 68px; }
.packet-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; margin-bottom: 14px; box-shadow: var(--shadow-sm); }

/* Profile header */
.profile-hd { padding: 24px; border-bottom: 1px solid var(--border); }
.profile-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 18px; gap: 12px; }
.p-avatar-wrap { display: flex; align-items: flex-start; gap: 14px; }
.p-avatar {
  width: 52px; height: 52px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; font-weight: 700; flex-shrink: 0;
}
.p-avatar-int { background: var(--arches-100); border: 2px solid var(--arches-200); color: var(--arches); }
.p-avatar-ext { background: #DBEAFE; border: 2px solid #BFDBFE; color: #2563EB; }
.p-name { font-size: 20px; font-weight: 700; color: var(--text); }
.p-role-line { font-size: 13px; color: var(--text-2); margin-top: 2px; }
.p-badges { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.p-match-block { text-align: right; flex-shrink: 0; }
.p-match-num { font-size: 40px; font-weight: 800; color: var(--rausch); line-height: 1; }
.p-match-label { font-size: 10px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }
.p-champs-note { font-size: 11px; color: var(--text-3); margin-top: 6px; text-align: right; }
.p-stats { display: flex; gap: 24px; flex-wrap: wrap; }
.p-stat { display: flex; flex-direction: column; gap: 2px; }
.p-stat-label { font-size: 10px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.05em; }
.p-stat-val { font-size: 13px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 6px; }

/* AI Summary */
.ai-summary { padding: 18px 22px; background: #FAFAFA; border-bottom: 1px solid var(--border); }
.ai-label { display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
.ai-text { font-size: 13px; color: var(--text); line-height: 1.7; }

/* AI Flags */
.flags-section { padding: 16px 22px; }
.flags-label { font-size: 10px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 10px; }
.ai-flag { display: flex; align-items: flex-start; gap: 8px; padding: 9px 12px; border-radius: var(--r-sm); margin-bottom: 7px; }
.ai-flag:last-child { margin-bottom: 0; }
.flag-warn { background: var(--arches-50); border: 1px solid var(--arches-200); }
.flag-info { background: #EFF6FF; border: 1px solid #DBEAFE; }
.flag-danger { background: var(--rausch-50); border: 1px solid var(--rausch-100); }
.flag-icon { font-size: 12px; flex-shrink: 0; margin-top: 1px; }
.flag-text { font-size: 12px; font-weight: 500; line-height: 1.4; }
.flag-warn .flag-text { color: var(--arches); }
.flag-info .flag-text { color: #2563EB; }
.flag-danger .flag-text { color: var(--rausch); }

/* Section headers inside packet */
.psec-label { padding: 16px 22px 0; font-size: 10px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.07em; }
.psec-body { padding: 12px 22px 22px; }

/* Skills */
.skill-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.skill-row:last-child { margin-bottom: 0; }
.skill-name { font-size: 12px; font-weight: 500; color: var(--text); width: 160px; flex-shrink: 0; }
.skill-bar-wrap { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; min-width: 40px; }
.skill-bar { height: 100%; border-radius: 3px; }
.skill-bar-v { background: var(--babu); }
.skill-bar-s { background: var(--arches); }

// ================================================================

const getInstance = id => D.roleInstances.find(r => r.id === id);
const getCandidate = id => D.candidates.find(c => c.id === id);
const getTemplate = id => D.roleTemplates[id];
const initials = name => name.split(' ').map(p => p[0]).join('').slice(0, 2).toUpperCase();
const getCandidatesForInstance = id => D.candidates.filter(c => c.appliedRoles && c.appliedRoles.includes(id));
const atRiskCandidates = () => D.candidates.filter(c => c.type === 'internal' && c.churnRisk === 'high');

function churnChip(risk, isHM) {
  if (!risk || isHM) return '';
  const map = { high: ['chip-rausch', '↑ High Churn'], med: ['chip-arches', 'Med Churn'], low: ['chip-babu', 'Low Churn'] };
  const [cls, label] = map[risk] || ['chip-gray', risk];
  return `<span class="chip ${cls}">${label}</span>`;
}

function stageChip(stage, labelOverride) {
  const cls = { applied: 'stage-applied', screen: 'stage-screen', loop: 'stage-loop', offer: 'stage-offer',
    take_home: 'stage-loop', tech_screen: 'stage-screen', system_design: 'stage-screen', bar_raiser: 'stage-loop' };
  const defaultLabels = { applied: 'Applied', screen: 'Screen', loop: 'Loop', offer: 'Offer',
    take_home: 'Take-Home', tech_screen: 'Tech Screen', system_design: 'Sys Design', bar_raiser: 'Bar Raiser' };
  const label = labelOverride || defaultLabels[stage] || stage;
  return `<span class="stage ${cls[stage] || 'stage-applied'}">${label}</span>`;
}

const getPlan = id => D.interviewPlans.find(p => p.id === id);
function getInstPlan(instanceId) {
  const inst = getInstance(instanceId);
  return inst && getPlan(inst.planId);
}
function getInstStageIds(instanceId) {
  const plan = getInstPlan(instanceId);
  return plan ? plan.stages.map(s => s.id) : ['applied', 'offer'];
}
function getStageLabel(instanceId, stageId) {
  const plan = getInstPlan(instanceId);
  if (!plan) return stageId;
  const s = plan.stages.find(s => s.id === stageId);
  return s ? s.label : stageId;
}
function getInstancesUsingPlan(planId) {
  return D.roleInstances.filter(r => r.planId === planId);
}

function exitChip(exit, instanceId) {
  const atLabel = getStageLabel(instanceId, exit.at);
  if (exit.status === 'rejected') {
    return `<div><span class="stage stage-rejected">Rejected</span><div class="stage-exit-trace">at ${atLabel}</div></div>`;
  }
  return `<div><span class="stage stage-withdrawn">Withdrew</span><div class="stage-exit-trace">at ${atLabel}</div></div>`;
}

function statusChip(label) {
  const map = { 'On Track': 'chip-babu', 'Needs Attention': 'chip-arches', 'Stalled': 'chip-rausch' };
  return `<span class="chip ${map[label] || 'chip-gray'}">${label}</span>`;
}

function daysClass(d) {
  return d >= 60 ? 'days-danger' : d >= 30 ? 'days-warn' : 'days-ok';
}

function intDot(status) {
  const cls = { synced: 'int-synced', stale: 'int-stale', disconnected: 'int-disconnected' };
  const label = { synced: 'Synced', stale: 'Stale', disconnected: 'Disconnected' };
  return `<span class="int-dot ${cls[status] || ''}"></span><span class="int-label">&nbsp;${label[status] || status}</span>`;
}

function navigate(updates) {
  Object.assign(S, updates);
  history.pushState({ ...S }, '');
  renderApp();
  window.scrollTo(0, 0);
}

window.addEventListener('popstate', e => {
  if (e.state) { Object.assign(S, e.state); renderApp(); window.scrollTo(0, 0); }
});

// ================================================================
// SETTINGS — PLAN EDITING (module-level state, not in nav history)
// ================================================================
let editingPlanId = null;

function planEditSave(planId) {
  const nameEl = document.getElementById(`edit-pname-${planId}`);
  const plan = getPlan(planId);
  if (nameEl && plan) plan.name = nameEl.value.trim() || plan.name;
  const rows = document.querySelectorAll(`.stage-row-${planId}`);
  rows.forEach((row, i) => {
    const inp = row.querySelector('.stage-label-input');
    if (inp && plan.stages[i]) plan.stages[i].label = inp.value.trim() || plan.stages[i].label;
  });
  editingPlanId = null;
  renderApp();
}

function planEditCancel() { editingPlanId = null; renderApp(); }

function planStageMove(planId, idx, dir) {
  const plan = getPlan(planId);
  const stages = plan.stages;
  const target = idx + dir;
  if (target < 1 || target >= stages.length - 1) return; // never move Applied or Offer
  [stages[idx], stages[target]] = [stages[target], stages[idx]];
  renderApp();
}

function planStageDelete(planId, idx) {
  const plan = getPlan(planId);
  plan.stages.splice(idx, 1);
  renderApp();
}

function planStageAdd(planId) {
  const plan = getPlan(planId);
  const newId = 'stage_' + Date.now();
  plan.stages.splice(plan.stages.length - 1, 0, { id: newId, label: 'New Stage' });
  renderApp();
  // Focus the new input after render
  setTimeout(() => {
    const inputs = document.querySelectorAll(`.stage-row-${planId} .stage-label-input`);
    if (inputs.length > 2) inputs[inputs.length - 2].focus();
  }, 50);
}

function planDelete(planId) {
  const usedBy = getInstancesUsingPlan(planId);
  if (usedBy.length > 0) {
    alert(`This plan is used by ${usedBy.length} active role instance${usedBy.length > 1 ? 's' : ''}. Reassign them before deleting.`);
    return;
  }
  D.interviewPlans = D.interviewPlans.filter(p => p.id !== planId);
  renderApp();
}

function planNew() {
  const newId = 'ip_' + Date.now();
  D.interviewPlans.push({ id: newId, name: 'New Plan', stages: [
    { id: 'applied', label: 'Applied' },
    { id: 'phone_screen', label: 'Phone Screen' },
    { id: 'offer', label: 'Offer' }
  ]});
  editingPlanId = newId;
  renderApp();
  setTimeout(() => { const el = document.getElementById(`edit-pname-${newId}`); if (el) { el.focus(); el.select(); } }, 50);
}

// ================================================================
function renderAtRisk() {
  const all = atRiskCandidates();
  const org = D.orgStats;
  const PAGE = 10;
  const page = S.atRiskPage || 0;
  const totalPages = Math.ceil(all.length / PAGE);
  const at = all.slice(page * PAGE, page * PAGE + PAGE);

  const endNum = Math.min(page * PAGE + PAGE, all.length);

  const cards = at.map(c => {
    const monthsSincePromo = c.lastPromotionDate
      ? Math.floor((new Date('2026-03-31') - new Date(c.lastPromotionDate)) / (1000 * 60 * 60 * 24 * 30))
      : null;
    const matchedInstances = (c.activeInstances || []).map(id => {

      const tpl = getTemplate(inst.templateId);
      return `${tpl.title} — ${inst.team} <span style="color:var(--rausch);font-weight:700">(${c.matchPcts[id]}%)</span>`;
    }).filter(Boolean).join(' &nbsp;·&nbsp; ');

    return `
    <div class="atrisk-card" data-action="go-candidate-packet" data-cid="${c.id}" data-iid="${c.activeInstances[0]}">

        <div>
          <div class="atrisk-name">${c.name}</div>
          <div class="atrisk-meta">${c.currentRole} &nbsp;·&nbsp; ${c.level} &nbsp;·&nbsp; ${c.tenureMonths} months at Airbnb</div>

            ${monthsSincePromo ? `<div class="atrisk-signal">🕐 No promotion in <strong>${monthsSincePromo} months</strong></div>` : ''}

            <div class="atrisk-signal">📋 ${c.priorApps} prior application${c.priorApps !== 1 ? 's' : ''}</div>

          ${matchedInstances ? `<div class="atrisk-matches">Matched to &nbsp;${matchedInstances}</div>` : ''}
        </div>
      </div>
      <div class="atrisk-right">
        <span class="chip chip-rausch">↑ High Churn</span>

      </div>

  }).join('');

  const pgBtns = Array.from({ length: totalPages }, (_, i) =>

  ).join('');

  return `

      <span class="pagination-info">Showing ${startNum}–${endNum} of ${all.length} matched at-risk employees</span>

      </div>
    </div>` : ''}

}

// ================================================================
// RENDER — ROLE BREAKOUT
// ================================================================
function renderRoleBreakout() {
  const inst = getInstance(S.instanceId);
  const tpl = getTemplate(inst.templateId);
  const isHM = S.view === 'hm';
  const p = inst.pipeline;
  const instStages = getInstStageIds(S.instanceId);

  // allCands always sorted by match for rank numbering
  let allCands = getCandidatesForInstance(S.instanceId)
    .sort((a, b) => (b.matchPcts[S.instanceId] || 0) - (a.matchPcts[S.instanceId] || 0));

  const threshold = inst.matchThreshold || 75;
  let filtered = allCands.slice();
  if (S.filter === 'internal') filtered = allCands.filter(c => c.type === 'internal');
  else if (S.filter === 'external') filtered = allCands.filter(c => c.type === 'external');
  else if (S.filter === 'endorsed') filtered = allCands.filter(c => c.championCount > 0);
  else if (S.filter === 'not-advanced') filtered = allCands.filter(c => c.exits && c.exits[S.instanceId]);
  else if (S.filter === 'recommended') filtered = allCands.filter(c => (c.matchPcts[S.instanceId] || 0) >= threshold);

  // Apply sort
  const sd = S.sortDir === 'asc' ? 1 : -1;
  if (S.sort === 'match') {
    filtered.sort((a, b) => sd * ((a.matchPcts[S.instanceId]||0) - (b.matchPcts[S.instanceId]||0)));
  } else if (S.sort === 'champs') {
    filtered.sort((a, b) => sd * (a.championCount - b.championCount));
  } else if (S.sort === 'stage') {
    filtered.sort((a, b) => {
      const ai = instStages.indexOf(a.stages[S.instanceId] || 'applied');
      const bi = instStages.indexOf(b.stages[S.instanceId] || 'applied');
      return sd * (ai - bi);
    });
  }

  const actionCands = allCands.filter(c => c.action && c.action[S.instanceId] && !(c.exits && c.exits[S.instanceId]));

  const candRows = filtered.map(c => {
    const pct = c.matchPcts[S.instanceId] || 0;
    const stage = c.stages[S.instanceId] || 'applied';
    const rank = allCands.indexOf(c) + 1;
    return `
    <div class="cand-row" data-action="go-candidate-packet" data-cid="${c.id}" data-iid="${S.instanceId}">
      <div class="cand-id">
        <div class="cand-name">${c.name}</div>
        <div class="cand-role">${c.type === 'internal' ? `<span style="color:var(--arches);font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.04em">Internal · </span>` : ''}${c.currentRole}</div>
      </div>
      <div class="cand-match">${pct}%</div>
      <div class="cand-churn">${churnChip(c.churnRisk, isHM)}</div>
      <div class="cand-champs">⭐ ${c.championCount}</div>
      <div class="cand-stage">${stageChip(stage)}</div>
      <div class="cand-hist">${c.priorApps > 0 ? `${c.priorApps} prior` : '—'}</div>
      <div class="cand-arrow">›</div>
    </div>`;
  }).join('');

  const fc = { all: allCands.length, recommended: allCands.filter(c => (c.matchPcts[S.instanceId] || 0) >= threshold).length, internal: allCands.filter(c => c.type === 'internal').length, external: allCands.filter(c => c.type === 'external').length, endorsed: allCands.filter(c => c.championCount > 0).length, notAdvanced: allCands.filter(c => c.exits && c.exits[S.instanceId]).length };

  return `
  <div class="content">
    ${!isHM ? `<button class="back-link" data-action="go-open-roles">← All Roles</button>` : ''}
    ${isHM ? `<div class="hm-banner">ℹ️ You are viewing candidates routed to your role instance. AI summaries and endorsements are read-only.</div>` : ''}
    <div class="page-title">${tpl.title} — ${inst.team}</div>
    <div class="page-meta">
      <div class="page-meta-item">📋 ${tpl.levelBand}</div>
      <span class="page-meta-sep">·</span>
      <div class="page-meta-item">👤 ${inst.hmName}</div>
      <span class="page-meta-sep">·</span>
      <div class="page-meta-item"><span class="${daysClass(inst.daysOpen)}">${inst.daysOpen} days open</span></div>
      <span class="page-meta-sep">·</span>
      <div class="page-meta-item">${statusChip(inst.statusLabel)}</div>
    </div>
    <div class="role-meta-bar">
      <div class="role-meta-left">
        ${instStages.map((s, i, arr) => {
          const chevron = i < arr.length - 1 ? `<div class="rmi-chevron">›</div>` : '';
          const stageBlock = (() => {
          const count = p[s] || 0;
          const rejected = inst.pipelineRejected && inst.pipelineRejected[s];
          const isApplied = s === 'applied';
          const isOffer = s === 'offer';

          if (isOffer) {
            const accepted = inst.offerAccepted;
            const hasOffer = count > 0;
            const offerName = inst.offerCandidate ? inst.offerCandidate.name : null;
            return `<div class="rmi">
              <div class="rmi-label">Offer</div>
              <div class="rmi-sublabel">${accepted ? 'accepted' : hasOffer ? 'pending' : 'none'}</div>
              <div class="rmi-offer-icon">${accepted ? '✅' : hasOffer ? '⏳' : '—'}</div>
              <div class="rmi-offer-label ${accepted ? 'rmi-offer-label-accepted' : hasOffer ? 'rmi-offer-label-pending' : 'rmi-offer-label-none'}">${accepted ? 'Accepted' : hasOffer ? 'Extended' : 'No offer'}</div>
              ${offerName && hasOffer ? `<div style="font-size:10px;color:var(--text-3);margin-top:3px;font-weight:500">${offerName}</div>` : ''}
            </div>`;
          }


          return `<div class="rmi">
            <div class="rmi-label">${getStageLabel(S.instanceId, s)}</div>
            <div class="rmi-sublabel">${isApplied ? 'all time' : 'upcoming'}</div>
            <div class="rmi-active">${count}</div>
            ${!isApplied && rejected ? `<div class="rmi-dropout">${rejected} didn't advance</div>` : ''}
          </div>`;
          })();
          return stageBlock + chevron;
        }).join('')}
      </div>
    </div>

    ${actionCands.length > 0 || inst.statusReason || inst.offerCandidate ? `
    <div class="action-band">
      <div class="action-band-hd">⚡ Needs your attention <span style="font-size:11px;font-weight:500;color:var(--text-3);text-transform:none;letter-spacing:0">(${actionCands.length + (inst.statusReason ? 1 : 0) + (inst.offerCandidate ? 1 : 0)})</span></div>
      ${inst.offerCandidate ? `
      <div class="action-card action-card-offer">
        <div style="font-size:20px">🤝</div>
        <div style="flex:1">
          <div class="action-card-label" style="color:var(--text)">Offer extended — ${inst.offerCandidate.name}</div>
          <div class="action-card-detail">Extended ${inst.offerCandidate.extendedDays} day${inst.offerCandidate.extendedDays !== 1 ? 's' : ''} ago · keep remaining candidates warm in case of decline</div>
        </div>
        <span class="offer-await-chip">⏳ Awaiting candidate</span>
      </div>` : ''}
      ${inst.statusReason ? `
      <div class="action-card urgency-${inst.statusLabel === 'Stalled' ? 'high' : 'med'}" style="cursor:default">
        <div style="font-size:18px">${inst.statusLabel === 'Stalled' ? '🔴' : '⚠️'}</div>
        <div style="flex:1">
          <div style="font-size:13px;font-weight:600;color:var(--text)">${inst.statusTitle || inst.statusLabel}</div>
          <div style="font-size:12px;color:var(--text-2);margin-top:2px">${inst.statusReason}</div>
        </div>
      </div>` : ''}
      ${actionCands.map(c => {
        const act = c.action[S.instanceId];
        return `
        <div class="action-card urgency-${act.urgency}" data-action="go-candidate-packet" data-cid="${c.id}" data-iid="${S.instanceId}">
          <div class="action-card-name">${c.name}</div>
          <div style="flex:1">
            <div class="action-card-label">${act.label}${act.waitingOn ? `<span style="font-weight:400;color:var(--text-3)"> (waiting on ${act.waitingOn === 'hm' ? 'hiring manager' : 'candidate'})</span>` : ''}</div>
            <div class="action-card-detail">${act.detail}</div>
          </div>
          <div class="action-card-btns">
            <button class="qa-btn qa-btn-advance" onclick="event.stopPropagation();alert('In the full build, this advances ${c.name} to the next stage.')">Advance →</button>
            <button class="qa-btn qa-btn-decline" onclick="event.stopPropagation();alert('In the full build, this archives ${c.name} from this role.')">✕</button>
          </div>
        </div>`;
      }).join('')}
    </div>` : ''}


    <div>
      <div class="section-hd">
        <div class="section-title">All Candidates <span class="section-count">${filtered.length} of ${allCands.length}</span></div>
        <div class="filter-tabs">
          <button class="ftab ${S.filter==='all'?'active':''}" data-action="set-filter" data-filter="all">All (${fc.all})</button>
          <button class="ftab ${S.filter==='recommended'?'active':''}" data-action="set-filter" data-filter="recommended">Sutra Recommended (${fc.recommended})</button>
          <button class="ftab ${S.filter==='internal'?'active':''}" data-action="set-filter" data-filter="internal">Internal (${fc.internal})</button>
          <button class="ftab ${S.filter==='external'?'active':''}" data-action="set-filter" data-filter="external">External (${fc.external})</button>
          <button class="ftab ${S.filter==='endorsed'?'active':''}" data-action="set-filter" data-filter="endorsed">Endorsed (${fc.endorsed})</button>
          ${fc.notAdvanced > 0 ? `<button class="ftab ${S.filter==='not-advanced'?'active':''}" data-action="set-filter" data-filter="not-advanced">Not Advanced (${fc.notAdvanced})</button>` : ''}
        </div>
      </div>
      <div class="card">
        <div class="table-wrap">
          <div style="min-width:700px">
            <div style="display:flex;align-items:center;padding:10px 20px;border-bottom:1px solid var(--border);background:#FAFAFA;gap:14px">
              <div style="flex:1;font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em">Candidate</div>
              <div style="width:54px;flex-shrink:0">
                <span class="sort-hd ${S.sort==='match'?'active':''}" data-action="set-sort" data-sort="match" style="font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em">Match<span class="sort-arrow">${S.sort==='match'?(S.sortDir==='desc'?'▼':'▲'):'⇅'}</span></span>
              </div>
              ${!isHM ? `<div style="width:92px;flex-shrink:0"><span style="font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em">Churn</span></div>` : ''}

              <div style="width:74px;flex-shrink:0;font-size:10px;font-weight:700;color:var(--text-3);text-align:center;text-transform:uppercase;letter-spacing:.06em">History</div>
              <div style="width:60px;flex-shrink:0"></div>
              <div style="width:12px;flex-shrink:0"></div>
            </div>
            ${filtered.length > 0 ? filtered.map(c => {
              const pct = c.matchPcts[S.instanceId] || 0;
              const stageId = c.stages[S.instanceId] || 'applied';
              const exit = c.exits && c.exits[S.instanceId];
              const rank = allCands.indexOf(c) + 1;
              const isTerminal = !!exit;
              return `
              <div class="cand-row${isTerminal ? ' cand-row-terminal' : ''}" data-action="go-candidate-packet" data-cid="${c.id}" data-iid="${S.instanceId}">
                <div class="cand-id">
                  <div class="cand-name">${c.name}</div>
                  <div class="cand-role">${c.type === 'internal' ? `<span style="color:var(--arches);font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.04em">Internal · </span>` : ''}${c.currentRole}</div>
                </div>
                <div class="cand-match" style="${isTerminal ? 'color:var(--text-3)' : ''}">${pct}%</div>
                ${!isHM ? `<div class="cand-churn">${isTerminal ? '' : churnChip(c.churnRisk, false)}</div>` : ''}
                <div class="cand-champs">⭐ ${c.championCount}</div>
                <div class="cand-stage">${isTerminal ? exitChip(exit, S.instanceId) : stageChip(stageId, getStageLabel(S.instanceId, stageId))}</div>
                <div class="cand-hist">${c.priorApps > 0 ? `${c.priorApps} prior` : '—'}</div>
                ${!isTerminal ? `<div class="cand-row-qa">
                  <button class="qa-btn qa-btn-advance" onclick="event.stopPropagation();alert('Advance ${c.name}')">→</button>
                  <button class="qa-btn qa-btn-decline" onclick="event.stopPropagation();alert('Archive ${c.name}')">✕</button>
                </div>` : '<div style="width:60px;flex-shrink:0"></div>'}
                <div class="cand-arrow">›</div>
              </div>`;
            }).join('') : `<div style="padding:32px;text-align:center;color:var(--text-3);font-size:13px">No candidates match this filter.</div>`}
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

// ================================================================
// RENDER — CANDIDATE PACKET
// ================================================================
function renderCandidatePacket() {
  const cand = getCandidate(S.candidateId);
  const inst = getInstance(S.instanceId);
  const tpl = getTemplate(inst.templateId);
  const isHM = S.view === 'hm';
  const pct = cand.matchPcts[S.instanceId] || 0;
  const stage = cand.stages[S.instanceId] || 'applied';
  const champions = D.champions[cand.id] || [];

  const avatarCls = cand.type === 'internal' ? 'p-avatar-int' : 'p-avatar-ext';
  const promoStr = cand.lastPromotionDate
    ? new Date(cand.lastPromotionDate).toLocaleDateString('en-US', { year: 'numeric', month: 'short' })
    : null;

  const otherInstances = (cand.activeInstances || []).filter(id => id !== S.instanceId);
  const multiNote = otherInstances.length > 0
    ? `<div class="multi-inst-note">ℹ️ Also active in: ${otherInstances.map(id => { const i = getInstance(id); const t = getTemplate(i.templateId); return `<strong>${t.title} — ${i.team}</strong>`; }).join(', ')}</div>`
    : '';

  const skillRows = cand.skills.map(s => `
    <div class="skill-row">
      <div class="skill-name">${s.name}</div>
      <div class="skill-bar-wrap"><div class="skill-bar ${s.validated ? 'skill-bar-v' : 'skill-bar-s'}" style="width:${s.pct}%"></div></div>
      <div class="skill-pct">${s.pct}%</div>
      <div class="skill-status ${s.validated ? 'sv' : 'ss'}">${s.validated ? '✓ Validated' : '⚠ Self-reported'}</div>
    </div>`).join('');

  const flagMap = { warn: ['flag-warn', '⚠'], info: ['flag-info', 'ℹ'], danger: ['flag-danger', '⚡'] };
  const flagRows = cand.aiFlags.map(f => {
    const [cls, icon] = flagMap[f.type] || ['flag-warn', '⚠'];
    return `<div class="ai-flag ${cls}"><span class="flag-icon">${icon}</span><span class="flag-text">${f.label}</span></div>`;
  }).join('');

  const histRows = cand.appHistory.length > 0
    ? cand.appHistory.map(h => `
      <div class="app-item">
        <div class="app-item-top"><div class="app-role">${h.role}</div><div class="app-date">${h.date}</div></div>
        <span class="chip chip-gray" style="font-size:11px">${h.outcome}</span>
        <div class="app-note">${h.note}</div>
      </div>`).join('')
    : `<div style="padding:12px 0;color:var(--text-3);font-size:13px">No prior application history.</div>`;

  const champCards = champions.length > 0
    ? champions.map(ch => `
      <div class="champ-card ${ch.flagged ? 'champ-flagged' : ''}">
        <div class="champ-hd">
          <div class="champ-avatar">${ch.initials}</div>
          <div>
            <div class="champ-name">${ch.name}</div>
            <div class="champ-role">${ch.role}</div>
            <div class="champ-meta">
              <span class="chip chip-gray" style="font-size:10px">${ch.team}</span>
              <span style="font-size:11px;color:var(--text-3)">${ch.rel} · ${ch.date}</span>
            </div>
          </div>
        </div>
        <div class="champ-note">"${ch.note}"</div>
        ${ch.flagged ? `<div class="champ-flag-label">⚠ Relationship disclosed</div>` : ''}
      </div>`).join('')
    : `<div style="padding:8px 0;color:var(--text-3);font-size:13px">No champion endorsements yet.</div>`;

  const stageOrder = inst.pipelineStages || ['applied', 'screen', 'loop', 'offer'];
  const nextStageId = stageOrder[stageOrder.indexOf(stage) + 1];
  const nextStageLabel = nextStageId ? getStageLabel(S.instanceId, nextStageId) : null;

  const actions = isHM
    ? `<button class="action-btn" onclick="alert('In the full build, this opens the interview feedback form.')">📝 Submit Interview Feedback</button>
       <button class="action-btn action-ghost" onclick="alert('In the full build, this opens calendar scheduling.')">📅 Schedule Debrief</button>`
    : `${nextStageId ? `<button class="action-btn action-primary" onclick="alert('In the full build, this advances ${cand.name} to ${nextStageLabel} in Greenhouse.')">Advance to ${nextStageLabel} →</button>` : `<button class="action-btn action-primary" onclick="alert('At offer stage.')">✓ At Offer Stage</button>`}
       <button class="action-btn" onclick="alert('In the full build, this opens calendar scheduling.')">📅 Schedule HM Review</button>
       <button class="action-btn action-ghost" onclick="alert('In the full build, this opens a note editor.')">📝 Add Note to Packet</button>
       <button class="action-btn action-endorse" onclick="alert('In the full build, this triggers an endorsement request email.')">⭐ Request Endorsement</button>`;

  return `
  <div class="content">
    <button class="back-link" data-action="go-role-breakout" data-iid="${S.instanceId}">← ${tpl.title} — ${inst.team}</button>
    ${multiNote}
    <div class="packet-layout">
      <div class="packet-main">

        <div class="packet-section">
          <div class="profile-hd">
            <div class="profile-top">
              <div class="p-avatar-wrap">
                <div class="p-avatar ${avatarCls}">${initials(cand.name)}</div>
                <div>
                  <div class="p-name">${cand.name}</div>
                  <div class="p-role-line">${cand.currentRole}</div>
                  <div class="p-badges">
                    <span class="badge badge-${cand.type}">${cand.type}</span>
                    ${cand.level ? `<span class="chip chip-gray" style="font-size:11px">${cand.level}</span>` : ''}
                    ${stageChip(stage)}
                    ${churnChip(cand.churnRisk, isHM)}
                  </div>
                </div>
              </div>
              <div class="p-match-block">
                <div class="p-match-num">${pct}%</div>
                <div class="p-match-label">Match Score</div>
                <div class="p-champs-note">⭐ ${cand.championCount} champion${cand.championCount !== 1 ? 's' : ''}</div>
              </div>
            </div>
            <div class="p-stats">
              ${cand.type === 'internal' && cand.tenureMonths ? `<div class="p-stat"><div class="p-stat-label">Tenure</div><div class="p-stat-val">${cand.tenureMonths} months</div></div>` : ''}
              ${promoStr ? `<div class="p-stat"><div class="p-stat-label">Last Promotion</div><div class="p-stat-val">${promoStr}</div></div>` : ''}
              <div class="p-stat"><div class="p-stat-label">Prior Applications</div><div class="p-stat-val">${cand.priorApps}</div></div>
              <div class="p-stat"><div class="p-stat-label">Current Stage</div><div class="p-stat-val">${stageChip(stage)}</div></div>
            </div>
          </div>

          <div class="ai-summary">
            <div class="ai-label">✦ Sutra AI Summary</div>
            <div class="ai-text">${cand.aiSummary}</div>
          </div>

          ${flagRows ? `
          <div class="flags-section">
            <div class="flags-label">AI Flags — always visible, never suppressed</div>
            ${flagRows}
          </div>` : ''}
        </div>

        <div class="packet-section">
          <div class="psec-label">Skills & Competencies</div>
          <div class="psec-body">
            <div style="display:flex;align-items:center;gap:16px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border)">
              <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--babu)"><div style="width:10px;height:10px;background:var(--babu);border-radius:2px"></div> Validated</div>
              <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--arches)"><div style="width:10px;height:10px;background:var(--arches);border-radius:2px"></div> Self-reported</div>
            </div>
            ${skillRows}
          </div>
        </div>

        <div class="packet-section">
          <div class="psec-label">Application History</div>
          <div class="psec-body">${histRows}</div>
        </div>

      </div>

      <div class="packet-side">
        <div class="packet-section">
          <div style="padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
            <div style="font-size:13px;font-weight:700">Champion Endorsements</div>
            <span class="chip chip-gray" style="font-size:11px">⭐ ${champions.length}</span>
          </div>
          <div style="padding:14px 16px">${champCards}</div>
        </div>

        <div class="packet-section">
          <div style="padding:14px 16px;border-bottom:1px solid var(--border)">
            <div style="font-size:13px;font-weight:700">${isHM ? 'Hiring Manager Actions' : 'Recruiter Actions'}</div>
          </div>
          <div class="actions-body">${actions}</div>
        </div>

        <div class="packet-section">
          <div class="ghost-card">
            <div class="ghost-label">Sutra 2.0 — Coming Soon</div>
            <div class="ghost-text">L&D pathway recommendations and growth trajectory analysis will appear here once skill profiles are established across the org.</div>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

// ================================================================
// RENDER — ANALYTICS
// ================================================================
function renderAnalytics() {
  const A = D.analytics;

  const kpiCards = A.kpis.map(k => `
    <div class="kpi-card">
      <div class="kpi-label">${k.label}</div>
      <div class="kpi-value">${k.value}</div>
      ${k.delta !== null
        ? `<div class="kpi-delta kpi-delta-pos">${k.positive ? '▲' : '▼'} ${Math.abs(k.delta)}${k.unit || '%'} <span style="color:var(--text-3);font-weight:400">${k.deltaLabel}</span></div>`
        : `<div class="kpi-delta kpi-delta-neu">${k.unit} ${k.deltaLabel}</div>`}
    </div>`).join('');

  const funnelSegs = A.pipelineConversion.map((f, i, arr) => {
    const isLast = i === arr.length - 1;
    const drop = !isLast ? arr[i].count - arr[i+1].count : null;
    const dropPct = drop ? Math.round(drop / f.count * 100) : null;
    // Color arrow by drop severity: green = low drop, amber = mid, red = high
    const arrowColor = isLast ? '#00A699' : dropPct >= 60 ? '#FF5A5F' : dropPct >= 30 ? '#FC642D' : '#059669';
    return `
    <div class="funnel-row">
      <div class="funnel-stage">${f.stage}</div>
      <div class="funnel-arrow" style="color:${arrowColor}">›</div>
      <div class="funnel-count">${f.count.toLocaleString()}</div>
      <div class="funnel-pct">${f.pct < 1 ? f.pct.toFixed(1) : Math.round(f.pct)}%</div>
      <div class="funnel-drop-note">${drop ? `<span style="color:${arrowColor};font-weight:600">↓ ${dropPct}%</span> didn't advance` : '<span style="color:#059669;font-weight:600">✓ hired</span>'}</div>
    </div>`;
  }).join('');

  const renderSourceRows = rows => rows.map(s => `
    <div class="source-row">
      <div class="source-dot" style="background:${s.color}"></div>
      <div style="flex:1;min-width:0">
        <div class="source-label">${s.label}</div>
        <div style="font-size:11px;color:var(--text-3);margin-top:1px">${s.note}</div>
      </div>
      <div class="source-bar-wrap" style="width:80px"><div class="source-bar" style="width:${s.pct}%;background:${s.color}"></div></div>
      <div class="source-count">${s.count}</div>
    </div>`).join('');
  const sutraTotal = A.sourceBreakdown.sutraOriginated.reduce((a, s) => a + s.count, 0);

  const maxDays = Math.max(...A.timeToFillByRole.map(r => Math.max(r.days, r.benchmark)));
  const ttfRows = A.timeToFillByRole.map(r => {
    const actualPct = (r.days / maxDays) * 100;
    const benchPct  = (r.benchmark / maxDays) * 100;
    const faster = r.days <= r.benchmark;
    return `
    <div class="ttf-row">
      <div class="ttf-role">${r.role}</div>
      <div class="ttf-bar-wrap">
        <div class="ttf-bar-actual" style="width:${actualPct}%;background:${faster ? '#00A699' : '#FF5A5F'}"></div>
        <div class="ttf-bar-benchmark" style="left:${benchPct}%"></div>
      </div>
      <div class="ttf-days" style="color:${faster ? '#059669' : '#DC2626'}">${r.days}d</div>
      <div class="ttf-vs" style="color:${faster ? '#059669' : '#DC2626'}">${faster ? '▲ ' : '▼ '}${Math.abs(r.days - r.benchmark)}d vs avg</div>
    </div>`;}).join('');

  const poolStats = A.poolUtilization.map(p => `
    <div class="pool-stat">
      <div class="pool-stat-val">${p.value}</div>
      <div class="pool-stat-label">${p.label}</div>
    </div>`).join('');

  const interventionRows = A.atRiskInterventions.map(i => {
    const ini = i.name.split(' ').map(p => p[0]).join('');
    const cls = i.outcome === 'Hired' ? 'outcome-hired' : i.outcome === 'Offer extended' ? 'outcome-offer' : 'outcome-active';
    return `
    <div class="intervention-row">
      <div class="intervention-avatar">${ini}</div>
      <div>
        <div class="intervention-name">${i.name}</div>
        <div class="intervention-move">${i.from} → ${i.to}</div>
      </div>
      <div class="intervention-outcome ${cls}">${i.outcome}</div>
    </div>`;}).join('');

  return `
  <div class="content">
    <div class="page-title" style="margin-bottom:4px">Analytics</div>
    <div style="font-size:13px;color:var(--text-3);margin-bottom:24px">${A.timeframe} · Recruiter view · All roles</div>

    <div class="kpi-grid">${kpiCards}</div>

    <div class="analytics-grid">
      <div class="card" style="padding:20px 24px">
        <div class="an-section-title">Pipeline Conversion</div>
        ${funnelSegs}
      </div>
      <div class="card" style="padding:20px 24px">
        <div class="an-section-title">Hire Origin</div>
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--babu);margin-bottom:8px">Sutra-originated <span style="font-size:11px;font-weight:600;color:var(--babu);background:#F0FAFA;border:1px solid #9DDAD6;border-radius:20px;padding:2px 8px;margin-left:4px">${sutraTotal} of ${A.sourceBreakdown.total} hires</span></div>
        ${renderSourceRows(A.sourceBreakdown.sutraOriginated)}
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);margin:14px 0 8px">Other sources — Sutra managed pipeline only</div>
        ${renderSourceRows(A.sourceBreakdown.otherSources)}
      </div>
    </div>

    <div class="analytics-grid">
      <div class="card" style="padding:20px 24px">
        <div class="an-section-title">Time to Fill by Role <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--text-3)">— bar = actual · line = org benchmark</span></div>
        ${ttfRows}
      </div>
      <div class="card" style="padding:20px 24px">
        <div class="an-section-title">At-Risk Interventions — Internal Mobility</div>
        ${interventionRows}
        <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:12px;color:var(--text-2)">
          18 at-risk employees retained via internal moves this quarter
        </div>
      </div>
    </div>

    <div class="analytics-full card" style="padding:20px 24px">
      <div class="an-section-title">Talent Pool Utilization</div>
      <div class="pool-stat-grid">${poolStats}</div>
    </div>
  </div>`;
}

// ================================================================
// RENDER — NOTIFICATIONS
// ================================================================
function renderNotifications() {
  const high = D.notifications.filter(n => n.urgency === 'high');
  const med = D.notifications.filter(n => n.urgency === 'med');
  const low = D.notifications.filter(n => n.urgency === 'low');

  const row = n => `
    <div class="notif-row" data-action="${n.candidateId ? 'go-candidate-packet' : (n.instanceId ? 'go-role-breakout' : 'noop')}" data-cid="${n.candidateId || ''}" data-iid="${n.instanceId || ''}">
      <div class="notif-icon ${n.iconClass}">${n.icon}</div>
      <div style="flex:1">
        <div class="notif-title">${n.title}</div>
        <div class="notif-detail">${n.detail}</div>
        <div class="notif-time">${n.time}</div>
      </div>
      <div class="urg-dot urg-${n.urgency}" style="margin-top:4px;flex-shrink:0"></div>
    </div>`;

  return `
  <div class="content">
    <div class="page-title" style="margin-bottom:6px">Notifications</div>
    <div style="font-size:13px;color:var(--text-2);margin-bottom:28px">Pending actions requiring your attention. Churn risk alerts are in the <strong>At Risk</strong> tab.</div>
    <div class="card">
      ${high.length > 0 ? `<div class="notif-group-label">🔴 Urgent — ${high.length}</div>${high.map(row).join('')}` : ''}
      ${med.length > 0 ? `<div class="notif-group-label">🟡 Medium — ${med.length}</div>${med.map(row).join('')}` : ''}
      ${low.length > 0 ? `<div class="notif-group-label">⚪ Low — ${low.length}</div>${low.map(row).join('')}` : ''}
    </div>
  </div>`;
}

// ================================================================
// MAIN RENDER
// ================================================================
function renderApp() {
  let screen = '';
  if (S.screen === 'at-risk') screen = renderAtRisk();
  else if (S.screen === 'analytics') screen = renderAnalytics();
  else if (S.screen === 'notifications') screen = renderNotifications();
  else if (S.screen === 'settings') screen = renderSettings();
  else if (S.screen === 'candidate-packet' && S.candidateId) screen = renderCandidatePacket();
  else if (S.screen === 'role-breakout' && S.instanceId) screen = renderRoleBreakout();
  else screen = renderOpenRoles();

  document.getElementById('root').innerHTML = renderTopNav() + renderTabBar() + screen;
}

// ================================================================
// EVENT DELEGATION
// ================================================================
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  e.preventDefault();
  const a = el.dataset.action;
  const iid = el.dataset.iid;
  const cid = el.dataset.cid;

  if (a === 'go-home' || a === 'go-open-roles') {
    navigate({ screen: S.view === 'hm' ? 'role-breakout' : 'open-roles', instanceId: S.view === 'hm' ? D.users.hm.instanceId : null, candidateId: null, filter: 'all', rolesPage: 0 });
  } else if (a === 'go-at-risk') {
    navigate({ screen: 'at-risk', instanceId: null, candidateId: null, atRiskPage: 0 });
  } else if (a === 'roles-page') {
    navigate({ rolesPage: parseInt(el.dataset.page) });
  } else if (a === 'atrisk-page') {
    navigate({ atRiskPage: parseInt(el.dataset.page) });
  } else if (a === 'go-notifications') {
    navigate({ screen: 'notifications' });
  } else if (a === 'go-role-breakout') {
    navigate({ screen: 'role-breakout', instanceId: iid || S.instanceId, candidateId: null, filter: 'all' });
  } else if (a === 'go-candidate-packet' && cid) {
    navigate({ screen: 'candidate-packet', candidateId: cid, instanceId: iid || S.instanceId });
  } else if (a === 'switch-view') {
    const v = el.dataset.view;
    navigate(v === 'hm'
      ? { view: 'hm', screen: 'role-breakout', instanceId: D.users.hm.instanceId, candidateId: null, filter: 'all' }
      : { view: 'recruiter', screen: 'open-roles', instanceId: null, candidateId: null, filter: 'all' });
  } else if (a === 'go-analytics') {
    navigate({ screen: 'analytics', instanceId: null, candidateId: null });
  } else if (a === 'go-settings') {
    navigate({ screen: 'settings', instanceId: null, candidateId: null });
  } else if (a === 'set-filter') {
    navigate({ filter: el.dataset.filter });
  } else if (a === 'set-sort') {
    const col = el.dataset.sort;
    if (S.sort === col) {
      navigate({ sortDir: S.sortDir === 'desc' ? 'asc' : 'desc' });
    } else {
      navigate({ sort: col, sortDir: 'desc' });
    }
  }
});

// ================================================================
// DEEP-LINK — parse ?screen= ?iid= ?cid= ?view= ?filter= on load
// ================================================================
(function() {
  const p = new URLSearchParams(location.search);
  if (p.get('view'))   S.view   = p.get('view');
  if (p.get('screen')) S.screen = p.get('screen');
  if (p.get('iid'))    S.instanceId  = p.get('iid');
  if (p.get('cid'))    S.candidateId = p.get('cid');
  if (p.get('filter')) S.filter = p.get('filter');
})();

// ================================================================
// INIT
// ================================================================
history.replaceState({ ...S }, '');
renderApp();
</script>
</body>
</html>
